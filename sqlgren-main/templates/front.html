<!doctype html>
<html lang="{{LANG}}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="{{PITCH}}">
  <meta property="og:title" content="{{TITLE}} · Acervo">
  <meta property="og:description" content="{{PITCH}}">
  <title>{{TITLE}} · Acervo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect rx='8' width='32' height='32' fill='%2307080c'/%3E%3Cpath d='M7 11c0-2.4 4-4.2 9-4.2s9 1.8 9 4.2-4 4.2-9 4.2-9-1.8-9-4.2z' fill='none' stroke='%235eead4' stroke-width='1.6'/%3E%3Cpath d='M7 11v11c0 2.4 4 4.2 9 4.2s9-1.8 9-4.2V11' fill='none' stroke='%235eead4' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>/*{{CSS}}*/</style>
</head>
<body>
  <a class="skip" href="#workspace" data-i="skip">Ir ao conteúdo</a>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="app">
    <aside class="rail" id="rail">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M6 10c0-2.8 4.5-5 10-5s10 2.2 10 5-4.5 5-10 5-10-2.2-10-5z" stroke="currentColor" stroke-width="1.6"/><path d="M6 10v12c0 2.8 4.5 5 10 5s10-2.2 10-5V10" stroke="currentColor" stroke-width="1.6"/><path d="M6 16c0 2.8 4.5 5 10 5s10-2.2 10-5" stroke="currentColor" stroke-width="1.6" opacity=".55"/></svg>
        </div>
        <div>
          <div class="brand-name">Acervo</div>
          <div class="brand-sub" id="brand-sub">SQL canônico</div>
        </div>
        <button class="icon-btn rail-close" id="rail-close" type="button" aria-label="Fechar menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <button class="cmd-launch" id="cmd-launch" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span data-i="search">Buscar · table: col: tag:</span>
        <kbd>⌘K</kbd>
      </button>

      <nav class="nav" aria-label="Seções">
        <button class="nav-item is-active" data-route="home" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z"/></svg>
          <span data-i="nav.home">Observatório</span>
        </button>
        <button class="nav-item" data-route="catalog" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          <span data-i="nav.catalog">Catálogo</span>
        </button>
        <button class="nav-item" data-route="lineage" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="8" r="2.2"/><circle cx="8" cy="18" r="2.2"/><circle cx="17" cy="17" r="2.2"/><path d="M8 7.6l8 1.2M7.6 8.2L8.4 16M16.2 9.8l-6.4 6.2M16.4 15.2l-1.2-5"/></svg>
          <span data-i="nav.lineage">Linhagem</span>
        </button>
        <button class="nav-item" data-route="tables" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7c0 1.7 3.6 3 8 3s8-1.3 8-3-3.6-3-8-3-8 1.3-8 3z"/><path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/></svg>
          <span data-i="nav.tables">Tabelas</span>
        </button>
        <button class="nav-item" data-route="impact" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5"/></svg>
          <span data-i="nav.impact">Impacto</span>
        </button>
        <button class="nav-item" data-route="twins" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="8" height="14" rx="2"/><rect x="13" y="5" width="8" height="14" rx="2"/></svg>
          <span data-i="nav.twins">Gêmeos</span>
        </button>
        <button class="nav-item" data-route="brief" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h9l3 3v13H6z"/><path d="M14 4v4h4M8 12h8M8 16h6"/></svg>
          <span data-i="nav.brief">Briefing</span>
        </button>
        <button class="nav-item" data-route="columns" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
          <span data-i="nav.columns">Colunas</span>
        </button>
        <button class="nav-item" data-route="relations" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/><path d="M9 8.5L15 15.5"/></svg>
          <span data-i="nav.relations">Relações</span>
        </button>
        <button class="nav-item" data-route="govern" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4v6c0 5-3.4 8.4-8 9-4.6-.6-8-4-8-9V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
          <span data-i="nav.govern">Governança</span>
        </button>
      </nav>

      <div class="rail-label" data-i="folders">Pastas</div>
      <div class="folder-tree" id="folder-tree"></div>

      <div class="rail-foot">
        <div class="health-mini" id="health-mini"></div>
        <div class="stamp" id="generated-at">Gerando…</div>
      </div>
    </aside>

    <div class="workspace" id="workspace">
      <header class="topbar">
        <button class="icon-btn" id="rail-open" type="button" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="crumbs" id="crumbs">Observatório</div>
        <div class="top-actions">
          <button class="ghost" id="btn-locale" type="button" title="PT / EN">PT</button>
          <button class="ghost" id="btn-export-sql" type="button" data-i="export.sql">Exportar SQL</button>
          <button class="ghost" id="btn-export-json" type="button">JSON</button>
          <button class="ghost" id="btn-export-csv" type="button">CSV</button>
          <button class="icon-btn" id="btn-theme" type="button" aria-label="Alternar tema" title="Tema">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          </button>
          <button class="icon-btn" id="btn-help" type="button" aria-label="Atalhos" title="Atalhos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 114 2c-.7.5-1.1 1-1.1 2v.3M12 17h.01"/></svg>
          </button>
        </div>
      </header>
      <main class="stage" id="stage"></main>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <div class="palette" id="palette" hidden>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="palette-input" type="search" placeholder="Ir para query, tabela, pasta ou comando…" autocomplete="off">
      </div>
      <div class="palette-list" id="palette-list"></div>
    </div>
  </div>

  <div class="modal" id="help-modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2>Atalhos</h2>
        <button class="icon-btn" id="help-close" type="button" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <dl class="keys">
        <div><dt><kbd>⌘</kbd><kbd>K</kbd> / <kbd>/</kbd></dt><dd>Command palette</dd></div>
        <div><dt><kbd>1</kbd></dt><dd>Observatório</dd></div>
        <div><dt><kbd>2</kbd></dt><dd>Catálogo</dd></div>
        <div><dt><kbd>3</kbd></dt><dd>Linhagem</dd></div>
        <div><dt><kbd>4</kbd></dt><dd>Tabelas</dd></div>
        <div><dt><kbd>5</kbd></dt><dd>Impacto</dd></div>
        <div><dt><kbd>6</kbd></dt><dd>Gêmeos</dd></div>
        <div><dt><kbd>7</kbd></dt><dd>Briefing</dd></div>
        <div><dt><kbd>8</kbd></dt><dd>Colunas</dd></div>
        <div><dt><kbd>9</kbd></dt><dd>Relações</dd></div>
        <div><dt><kbd>0</kbd></dt><dd>Governança</dd></div>
        <div><dt><kbd>T</kbd></dt><dd>Tema</dd></div>
        <div><dt><kbd>Esc</kbd></dt><dd>Fechar overlay</dd></div>
        <div><dt><kbd>?</kbd></dt><dd>Esta ajuda</dd></div>
      </dl>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="application/json" id="sqldoc-data">{{DATA}}</script>
  <script>/*{{JS}}*/</script>
</body>
</html>
